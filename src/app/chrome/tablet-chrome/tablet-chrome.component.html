<!-- Gradient background with white content card (no side nav, no page header) -->
<div class="t-page">
  <div class="t-card">
    <header class="t-page-header" [class.t-page-header--dimmed]="chrome.dimChrome()">
      <div class="t-page-header__row">
        <div class="t-page-header__title">
          <span class="t-page-header__icon">
            <ui-core-icon icon="grid_view" size="sm"></ui-core-icon>
          </span>
          <h1 class="t-page-header__heading">Page Title</h1>
        </div>
      </div>
      <p class="t-page-header__desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    </header>

    <div class="t-card__body">
      <ng-content></ng-content>
    </div>
  </div>
</div>

<!-- Bottom navigation fixed to viewport bottom -->
<nav class="t-bottomnav" [class.t-bottomnav--dimmed]="chrome.dimChrome()">
  @for (item of bottomNav; track item.label) {
    <span class="t-bottomnav__item" [class.t-bottomnav__item--active]="item.active">
      <ui-core-icon class="t-bottomnav__icon" [icon]="item.icon" size="sm"></ui-core-icon>
      <span class="t-bottomnav__label">{{ item.label }}</span>
    </span>
  }
</nav>
