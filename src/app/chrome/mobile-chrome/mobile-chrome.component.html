<!-- Page title + tabs -->
<div class="m-header" [class.m-header--dimmed]="chrome.dimChrome()">
  <h1 class="m-header__title">Page Title</h1>
  <nav class="m-tabs">
    @for (tab of tabs; track tab.label) {
      <span class="m-tabs__tab" [class.m-tabs__tab--active]="tab.active">{{ tab.label }}</span>
    }
  </nav>
</div>

<!-- The routed prototype renders here -->
<div class="m-content">
  <ng-content></ng-content>
</div>

<!-- Bottom navigation, fixed to the bottom of the viewport -->
<nav class="m-bottomnav" [class.m-bottomnav--dimmed]="chrome.dimChrome()">
  @for (item of bottomNav; track item.label) {
    <span class="m-bottomnav__item" [class.m-bottomnav__item--active]="item.active">
      <ui-core-icon class="m-bottomnav__icon" [icon]="item.icon" size="sm"></ui-core-icon>
      <span class="m-bottomnav__label">{{ item.label }}</span>
    </span>
  }
</nav>
