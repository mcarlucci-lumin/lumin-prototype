<div class="prototype-preview" #stage>
    @if (src) {
        <!-- Inert on purpose: the tile's own click handler owns navigation, so the
             iframe must not swallow pointer events or take focus. -->
        <iframe class="prototype-preview__frame"
                [src]="src"
                [width]="viewportWidth"
                [height]="viewportHeight"
                [class.prototype-preview__frame--ready]="state === 'loaded'"
                scrolling="no"
                tabindex="-1"
                aria-hidden="true"
                (load)="onLoad()"
                (error)="onError()"></iframe>
    }

    @if (state === 'loaded') {
        <!-- Hover affordance only — pointer-events stay off so the tile keeps the click. -->
        <div class="prototype-preview__hint">
            <span class="prototype-preview__hint-chip">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </span>
        </div>
    }

    @if (state !== 'loaded') {
        <div class="prototype-preview__overlay">
            @if (state === 'error') {
                <span class="prototype-preview__error">Preview unavailable</span>
            } @else {
                <div class="prototype-preview__shimmer"></div>
            }
        </div>
    }
</div>
