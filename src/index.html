<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lumin Prototype</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #fff;
    }
    #app-loader-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d0d5dd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: app-spin 0.7s linear infinite;
    }
    #app-loader-label {
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      color: #999;
      letter-spacing: 0.02em;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="preload" href="/assets/fonts/MaterialSymbols-Sharp-Filled-Bold-v2.941.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    function checkMaterialIconsLoaded() {
      document.fonts.load('1em "Material Symbols Sharp Filled Bold"').then(function() {
        document.documentElement.classList.add('material-icons-loaded');
      }).catch(function(e) { console.warn('material-symbols font failed to load', e); });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', checkMaterialIconsLoaded);
    } else {
      checkMaterialIconsLoaded();
    }
  </script>
</head>
<body>
  <app-root>
    <div id="app-loader">
      <div id="app-loader-spinner"></div>
      <span id="app-loader-label">Loading…</span>
    </div>
  </app-root>
</body>
</html>
